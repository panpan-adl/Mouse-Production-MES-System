name: mousemes-knowledge
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${MES_KNOWLEDGE_NEO4J_PASSWORD:?Set MES_KNOWLEDGE_NEO4J_PASSWORD before starting}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - knowledge-neo4j:/data
volumes:
  knowledge-neo4j:
