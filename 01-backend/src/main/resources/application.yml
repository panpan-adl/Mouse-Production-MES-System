server:
  port: 8080

mes:
  knowledge:
    enabled: ${MES_KNOWLEDGE_ENABLED:false}
    neo4j-url: ${MES_KNOWLEDGE_NEO4J_URL:http://127.0.0.1:7474}
    neo4j-database: ${MES_KNOWLEDGE_NEO4J_DATABASE:neo4j}
    neo4j-user: ${MES_KNOWLEDGE_NEO4J_USER:neo4j}
    neo4j-password: ${MES_KNOWLEDGE_NEO4J_PASSWORD:}
    model-base-url: ${MES_KNOWLEDGE_MODEL_BASE_URL:}
    model: ${MES_KNOWLEDGE_MODEL:}
    model-api-key: ${MES_KNOWLEDGE_MODEL_API_KEY:}

  face:
    enabled: ${MES_FACE_ENABLED:false}
    endpoint: ${MES_FACE_ENDPOINT:http://127.0.0.1:8091}
    model: ${MES_FACE_MODEL:deepface-sface-opencv-v1}
    secret: ${MES_FACE_SECRET:}
    key: ${MES_FACE_KEY:}
    key-id: ${MES_FACE_KEY_ID:local-v1}
    threshold: ${MES_FACE_THRESHOLD:}
    margin: ${MES_FACE_MARGIN:}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: mouse-mes
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mouse_mes?useUnicode=true&useSSL=false&characterEncoding=utf-8&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/init.sql
      encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mouse.mes.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: INFO
    com.mouse.mes: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mouse-mes.log
