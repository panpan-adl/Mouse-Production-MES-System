<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单条形码生成器</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f7fa; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .num { font-size: 16px; color: #666; margin-bottom: 10px; font-weight: bold; }
        canvas { border: 1px solid #eee; border-radius: 8px; margin: 0 auto; display: block; }
        .btn { margin-top: 10px; padding: 8px 24px; background: #1890ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #096dd9; }
        .tip { text-align: center; color: #999; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>订单条形码生成器</h1>
    
    <div class="card">
        <div class="num">订单号: ORD260715001</div>
        <canvas id="c1" width="350" height="120"></canvas>
        <button class="btn" onclick="save('c1','ORD260715001')">保存图片</button>
    </div>
    <div class="card">
        <div class="num">订单号: ORD260715002</div>
        <canvas id="c2" width="350" height="120"></canvas>
        <button class="btn" onclick="save('c2','ORD260715002')">保存图片</button>
    </div>
    <div class="card">
        <div class="num">订单号: ORD260715003</div>
        <canvas id="c3" width="350" height="120"></canvas>
        <button class="btn" onclick="save('c3','ORD260715003')">保存图片</button>
    </div>
    <div class="card">
        <div class="num">订单号: ORD260715004</div>
        <canvas id="c4" width="350" height="120"></canvas>
        <button class="btn" onclick="save('c4','ORD260715004')">保存图片</button>
    </div>
    <div class="card">
        <div class="num">订单号: ORD260715005</div>
        <canvas id="c5" width="350" height="120"></canvas>
        <button class="btn" onclick="save('c5','ORD260715005')">保存图片</button>
    </div>
    
    <div class="tip">
        <p>📷 使用微信小程序扫码录入功能扫描这些条形码</p>
        <p>扫码后自动查询或创建订单</p>
    </div>

    <script>
        var CODE128_PATTERNS = [
            '212222','222122','222221','121223','121322','131222','122213','122312','132212','221213',
            '221312','231212','112232','122132','122231','113222','123122','123221','223211','221132',
            '221231','213212','223112','312131','311222','321122','321221','312212','322112','322211',
            '212123','212321','232121','111323','131123','131321','112313','132113','132311','211313',
            '231113','231311','112133','112331','132131','113123','113321','133121','313121','211331',
            '231131','213113','213311','213131','311123','311321','331121','312113','312311','332111',
            '314111','221411','431111','111224','111422','121124','121421','141122','141221','112214',
            '112412','122114','122411','142112','142211','241211','221114','413111','241112','134111',
            '111242','121142','121241','114212','124112','124211','411212','421112','421211','212141',
            '214121','412121','111424','141124','141421','112414','142114','142411','411412','411214',
            '421114','412114','214141','214112','132132','132321','212131','331111','212122','222211',
            '221133','241111','111431','2331112'
        ];

        var START_B = 104;
        var STOP = 106;

        function charToCode128B(char) {
            var CHARS = ' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~';
            return CHARS.indexOf(char);
        }

        function calculateChecksum(codes) {
            var checksum = codes[0];
            for (var i = 0; i < codes.length - 1; i++) {
                checksum += codes[i + 1] * (i + 1);
            }
            return checksum % 103;
        }

        function encode(text) {
            var codes = [START_B];
            for (var i = 0; i < text.length; i++) {
                codes.push(charToCode128B(text[i]));
            }
            var checksum = calculateChecksum(codes);
            codes.push(checksum);
            codes.push(STOP);
            return codes;
        }

        function drawBarcode(canvasId, text) {
            var canvas = document.getElementById(canvasId);
            var ctx = canvas.getContext('2d');
            var unitWidth = 2;
            var barHeight = 80;
            var startX = 20;
            var startY = 15;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000000';

            var codes = encode(text);
            var currentX = startX;

            codes.forEach(function(code) {
                var pattern = CODE128_PATTERNS[code];
                if (!pattern) return;
                for (var i = 0; i < pattern.length; i++) {
                    var width = parseInt(pattern[i]) * unitWidth;
                    if (i % 2 === 0) {
                        ctx.fillRect(currentX, startY, width, barHeight);
                    }
                    currentX += width;
                }
            });

            ctx.fillStyle = '#333333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text, canvas.width / 2, barHeight + 35);
        }

        function save(canvasId, filename) {
            var canvas = document.getElementById(canvasId);
            var link = document.createElement('a');
            link.download = 'barcode_' + filename + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        drawBarcode('c1', 'ORD260715001');
        drawBarcode('c2', 'ORD260715002');
        drawBarcode('c3', 'ORD260715003');
        drawBarcode('c4', 'ORD260715004');
        drawBarcode('c5', 'ORD260715005');
    </script>
</body>
</html>
